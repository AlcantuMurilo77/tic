app = "tic-uzd3zg"
primary_region = "iad"  

[build]
  dockerfile = "Dockerfile"

[env]
  # Adicione o dominio da Vercel na lista (ex: https://seu-app.vercel.app)
  CORS_ALLOWED_ORIGINS = "https://tic-front-dokxq1595-number11.vercel.app,https://jogodavelha.site,https://www.jogodavelha.site,http://131.196.19.251,https://131.196.19.251"

[[services]]
  internal_port = 33177    
  protocol = "tcp"        
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    handlers = ["http"]     
    port = 8080         

  [[services.ports]]
    handlers = ["http"]     
    port = 80         

  [[services.ports]]
    # Removido "proxy_proto" para nao corromper requisicoes HTTP/TLS
    handlers = ["tls", "http"] 
    port = 443
